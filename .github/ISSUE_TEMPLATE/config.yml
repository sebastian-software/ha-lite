blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability as a private advisory
    url: https://github.com/sebastian-software/ha-lite/security/advisories/new
    about: Do not open a public issue. This is the preferred route for anything with a security impact.
  - name: Report a security vulnerability by email
    url: https://docs.github.com/code-security/getting-started/adding-a-security-policy-to-your-repository
    about: Do not open a public issue. Email security@sebastian-software.de — this route always works, whatever the repository's settings are.
  - name: Report a Home Assistant bug that ha-lite inherited
    url: https://github.com/home-assistant/core/issues
    about: ha-lite is a reduction of Home Assistant Core. A defect that reproduces on upstream Home Assistant belongs in its issue tracker.
