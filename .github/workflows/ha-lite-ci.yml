name: ha-lite CI

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-lite-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/uv-cache
  APT_CACHE_VERSION: "1"
  HASS_CI: "1"
  PYTHONASYNCIODEBUG: "1"

jobs:
  prepare:
    name: Prepare Home Assistant test environment
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      python-version: ${{ steps.meta.outputs.python_version }}
      uv-version: ${{ steps.meta.outputs.uv_version }}
      cache-key: ${{ steps.meta.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: meta
        name: Resolve tool versions and cache key
        shell: bash
        run: |
          python_version="$(cat .python-version)"
          uv_version="$(grep '^uv==' requirements.txt | cut -d= -f3)"
          hash="$(sha256sum requirements.txt requirements_all.txt requirements_test.txt requirements_test_pre_commit.txt homeassistant/package_constraints.txt | sha256sum | cut -d' ' -f1)"
          echo "python_version=${python_version}" >> "$GITHUB_OUTPUT"
          echo "uv_version=${uv_version}" >> "$GITHUB_OUTPUT"
          echo "cache_key=ha-lite-venv-${hash}" >> "$GITHUB_OUTPUT"

      - name: Build and cache test environment
        uses: ./.github/actions/restore-or-build-venv
        with:
          python-version: ${{ steps.meta.outputs.python_version }}
          uv-version: ${{ steps.meta.outputs.uv_version }}
          python-cache-key: ${{ steps.meta.outputs.cache_key }}
          uv-cache-dir: ${{ env.UV_CACHE_DIR }}
          apt-cache-version: ${{ env.APT_CACHE_VERSION }}
          save: "true"

      - name: Compile English translations
        shell: bash
        run: |
          . venv/bin/activate
          python -m script.translations develop --all

      - name: Basic import sanity
        shell: bash
        run: |
          . venv/bin/activate
          python -c "import homeassistant; import homeassistant.bootstrap; print(\"Home Assistant imports OK\")"

  core-runtime:
    name: Core runtime tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-or-build-venv
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          uv-version: ${{ needs.prepare.outputs.uv-version }}
          python-cache-key: ${{ needs.prepare.outputs.cache-key }}
          uv-cache-dir: ${{ env.UV_CACHE_DIR }}
          apt-cache-version: ${{ env.APT_CACHE_VERSION }}
      - name: Compile English translations
        run: |
          . venv/bin/activate
          python -m script.translations develop --all
      - name: Test core lifecycle and registries
        run: |
          . venv/bin/activate
          python -b -X dev -m pytest -q \
            --timeout=20 \
            --durations=20 \
            -p no:sugar \
            tests/test_bootstrap.py \
            tests/test_core.py \
            tests/test_config_entries.py \
            tests/test_loader.py \
            tests/test_setup.py \
            tests/helpers/test_aiohttp_client.py \
            tests/helpers/test_config_entry_flow.py \
            tests/helpers/test_config_entry_oauth2_flow.py \
            tests/helpers/test_device_registry.py \
            tests/helpers/test_dispatcher.py \
            tests/helpers/test_entity.py \
            tests/helpers/test_entity_component.py \
            tests/helpers/test_entity_platform.py \
            tests/helpers/test_entity_registry.py \
            tests/helpers/test_event.py \
            tests/helpers/test_issue_registry.py \
            tests/helpers/test_restore_state.py \
            tests/helpers/test_service.py \
            tests/helpers/test_service_info.py \
            tests/helpers/test_state.py \
            tests/helpers/test_storage.py \
            tests/helpers/test_system_info.py \
            tests/helpers/test_translation.py \
            tests/helpers/test_update_coordinator.py

  headless-infrastructure:
    name: Headless infrastructure tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-or-build-venv
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          uv-version: ${{ needs.prepare.outputs.uv-version }}
          python-cache-key: ${{ needs.prepare.outputs.cache-key }}
          uv-cache-dir: ${{ env.UV_CACHE_DIR }}
          apt-cache-version: ${{ env.APT_CACHE_VERSION }}
      - name: Compile English translations
        run: |
          . venv/bin/activate
          python -m script.translations develop --all
      - name: Test API, discovery and operational substrate
        run: |
          . venv/bin/activate
          python -b -X dev -m pytest -q \
            --timeout=20 \
            --durations=20 \
            -p no:sugar \
            tests/components/api \
            tests/components/auth \
            tests/components/http \
            tests/components/websocket_api \
            tests/components/config \
            tests/components/logger \
            tests/components/system_log \
            tests/components/system_health \
            tests/components/application_credentials \
            tests/components/webhook \
            tests/components/persistent_notification \
            tests/components/homeassistant/test_init.py \
            tests/components/homeassistant/test_exposed_entities.py \
            tests/components/homeassistant/test_repairs.py \
            tests/components/network \
            tests/components/zeroconf \
            tests/components/bluetooth \
            tests/components/dhcp \
            tests/components/ssdp \
            tests/components/usb \
            tests/components/repairs \
            tests/components/diagnostics \
            tests/components/conversation \
            tests/components/mcp_server

  entity-domain-substrate:
    name: "Entity domain: ${{ matrix.domain }}"
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        domain:
          - alarm_control_panel
          - binary_sensor
          - button
          - camera
          - climate
          - cover
          - date
          - datetime
          - event
          - fan
          - image
          - light
          - lock
          - media_player
          - notify
          - number
          - select
          - sensor
          - siren
          - switch
          - text
          - time
          - update
          - vacuum
          - valve
          - water_heater
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-or-build-venv
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          uv-version: ${{ needs.prepare.outputs.uv-version }}
          python-cache-key: ${{ needs.prepare.outputs.cache-key }}
          uv-cache-dir: ${{ env.UV_CACHE_DIR }}
          apt-cache-version: ${{ env.APT_CACHE_VERSION }}
      - name: Install camera system dependency
        if: matrix.domain == 'camera'
        uses: ./.github/actions/cache-apt-packages
        with:
          packages: libturbojpeg
          version: ${{ env.APT_CACHE_VERSION }}
      - name: Compile English translations
        run: |
          . venv/bin/activate
          python -m script.translations develop --all
      - name: Run entity-domain tests
        run: |
          . venv/bin/activate
          python -b -X dev -m pytest -q \
            --timeout=20 \
            --durations=20 \
            -p no:sugar \
            "tests/components/${{ matrix.domain }}"

  device-class-semantics:
    name: "Device class: ${{ matrix.domain }}"
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        domain:
          - air_quality
          - battery
          - door
          - doorbell
          - garage_door
          - gate
          - humidity
          - illuminance
          - moisture
          - motion
          - occupancy
          - power
          - temperature
          - vibration
          - window
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-or-build-venv
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          uv-version: ${{ needs.prepare.outputs.uv-version }}
          python-cache-key: ${{ needs.prepare.outputs.cache-key }}
          uv-cache-dir: ${{ env.UV_CACHE_DIR }}
          apt-cache-version: ${{ env.APT_CACHE_VERSION }}
      - name: Compile English translations
        run: |
          . venv/bin/activate
          python -m script.translations develop --all
      - name: Run device-class trigger and condition tests
        run: |
          . venv/bin/activate
          python -b -X dev -m pytest -q \
            -n auto \
            --timeout=20 \
            --durations=20 \
            -p no:sugar \
            "tests/components/${{ matrix.domain }}"

  retained-integrations:
    name: "Integration: ${{ matrix.integration }}"
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        integration:
          - shelly
          - mqtt
          - matter
          - hue
          - fronius
          - modbus
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-or-build-venv
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          uv-version: ${{ needs.prepare.outputs.uv-version }}
          python-cache-key: ${{ needs.prepare.outputs.cache-key }}
          uv-cache-dir: ${{ env.UV_CACHE_DIR }}
          apt-cache-version: ${{ env.APT_CACHE_VERSION }}
      - name: Compile English translations
        run: |
          . venv/bin/activate
          python -m script.translations develop --all
      - name: Run integration tests
        run: |
          . venv/bin/activate
          python -b -X dev -m pytest -q \
            --timeout=20 \
            --durations=20 \
            -p no:sugar \
            "tests/components/${{ matrix.integration }}"

  static-sanity:
    name: Static sanity
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/restore-or-build-venv
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          uv-version: ${{ needs.prepare.outputs.uv-version }}
          python-cache-key: ${{ needs.prepare.outputs.cache-key }}
          uv-cache-dir: ${{ env.UV_CACHE_DIR }}
          apt-cache-version: ${{ env.APT_CACHE_VERSION }}
      - name: Run focused prek checks
        env:
          PREK_SKIP: no-commit-to-branch,mypy,pylint,gen_requirements_all,hassfest,hassfest-metadata,hassfest-mypy-config,zizmor
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          . venv/bin/activate
          base="${PR_BASE_SHA:-${PUSH_BEFORE_SHA}}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            prek run --all-files
          else
            prek run --from-ref "${base}" --to-ref HEAD
          fi

      - name: Check trigger and condition targets
        run: |
          . venv/bin/activate
          python script/ha_lite_trigger_targets.py --check

      - name: Check the retained dependency closure
        run: |
          . venv/bin/activate
          python script/ha_lite_closure.py --check

      - name: Verify the committed closure is current
        run: |
          . venv/bin/activate
          python script/ha_lite_closure.py \
            --write docs/architecture/retained-closure.json >/dev/null
          if ! git diff --exit-code -- docs/architecture/retained-closure.json; then
            echo "::error::docs/architecture/retained-closure.json is stale." \
                 "Regenerate it with:" \
                 "python3 script/ha_lite_closure.py --write docs/architecture/retained-closure.json"
            exit 1
          fi
