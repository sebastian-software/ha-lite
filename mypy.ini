# Automatically generated by hassfest.
#
# To update, run python3 -m script.hassfest -p mypy_config

[mypy]
python_version = 3.14
platform = linux
mypy_path = stubs
plugins = pydantic.mypy, mypy_plugins/enum_identity_compare.py
show_error_codes = true
follow_imports = normal
native_parser = true
num_workers = 2
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = deprecated, explicit-override, ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[mypy-homeassistant.*]
no_implicit_reexport = true

